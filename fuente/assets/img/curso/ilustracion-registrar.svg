<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="Una hoja de registro apaisada, como una hoja de cálculo, con cabecera verde y tres columnas: el día, la descripción y el monto. Nueve renglones ya anotados, con montos pequeños a la derecha; el décimo está a medio escribir y sobre él se apoya un lápiz dorado, tendido sobre la hoja.">
  <!-- Ilustración de marca · Posgrados Panamericana · finanzas-personales · tema 1, apertura (v2, revisión del diagramador)
       Concepto (DI, apertura del tema 1): «el primer paso de cualquier presupuesto no es recortar, sino registrar».
       Familia de UP (INSTITUCION.md §1.7): plana, geométrica, sin trazo, esquinas de 4 px, fondo y sombra de la
       familia. La hoja ocupa el ancho (x 220–980) para que a 390 px los renglones sigan leyéndose (barras de 14 px).
       Único dorado: el lápiz que anota la entrada del día (el acto de registrar). Sin texto.
       El Tahalí lo pone la piel, no el SVG. Guion en insumos/ILUSTRACIONES.md. -->
  <defs>
    <linearGradient id="ilu-registrar-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E4EEEB"/>
      <stop offset="55%"  stop-color="#ECF1EF"/>
      <stop offset="100%" stop-color="#F6F8F7"/>
    </linearGradient>
    <filter id="ilu-registrar-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A4039" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="4" fill="url(#ilu-registrar-fondo)"/>

  <!-- La hoja de registro: blanca, con cabecera verde hondo -->
  <g filter="url(#ilu-registrar-sombra)">
    <rect x="220" y="52" width="760" height="320" rx="4" fill="#FFFFFF"/>
  </g>
  <rect x="220" y="52" width="760" height="56" rx="4" fill="#0A4039"/>
  <rect x="220" y="80" width="760" height="28" fill="#0A4039"/>
  <!-- los encabezados de las tres columnas, como barras -->
  <rect x="252" y="73" width="26"  height="14" rx="2" fill="#4B857C"/>
  <rect x="296" y="73" width="150" height="14" rx="2" fill="#CFE0DC"/>
  <rect x="860" y="73" width="84"  height="14" rx="2" fill="#4B857C"/>

  <!-- Un mes de gastos, anotados uno por uno: día · descripción · monto -->
  <g>
    <rect x="220" y="148" width="760" height="22" fill="#F6F8F7"/>
    <rect x="220" y="192" width="760" height="22" fill="#F6F8F7"/>
    <rect x="220" y="236" width="760" height="22" fill="#F6F8F7"/>
    <rect x="220" y="280" width="760" height="22" fill="#F6F8F7"/>
    <rect x="220" y="324" width="760" height="22" fill="#F6F8F7"/>
    <rect x="252" y="130" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="130" width="380" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="872" y="130" width="72" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="152" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="152" width="300" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="886" y="152" width="58" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="174" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="174" width="420" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="860" y="174" width="84" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="196" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="196" width="260" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="890" y="196" width="54" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="218" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="218" width="350" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="880" y="218" width="64" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="240" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="240" width="400" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="866" y="240" width="78" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="262" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="262" width="280" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="888" y="262" width="56" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="284" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="284" width="370" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="874" y="284" width="70" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="306" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="306" width="320" height="14" rx="2" fill="#CFE0DC"/>
    <rect x="884" y="306" width="60" height="14" rx="2" fill="#0F5C51"/>
    <rect x="252" y="328" width="18" height="14" rx="2" fill="#3F7D74"/>
    <rect x="296" y="328" width="150" height="14" rx="2" fill="#CFE0DC"/>
  </g>
  <!-- las divisiones de las columnas -->
  <rect x="284" y="108" width="3" height="264" fill="#ECF1EF"/>
  <rect x="846" y="108" width="3" height="264" fill="#ECF1EF"/>

  <!-- ÚNICO DORADO: el lápiz que anota la entrada de hoy. Punta en el renglón a medio escribir; tendido sobre la
       banda de las descripciones, sin tapar ningún monto -->
  <g transform="translate(452 335) rotate(68)" filter="url(#ilu-registrar-sombra)">
    <polygon points="0,0 -12,-38 12,-38" fill="#F1EAD9"/>
    <polygon points="0,0 -4,-13 4,-13" fill="#0A4039"/>
    <rect x="-12" y="-292" width="24" height="254" fill="#B9975B"/>
    <rect x="-12" y="-292" width="8"  height="254" fill="#8D6E39"/>
    <rect x="-12" y="-312" width="24" height="20" fill="#0A4039"/>
    <rect x="-12" y="-330" width="24" height="18" rx="3" fill="#3F7D74"/>
  </g>
</svg>
