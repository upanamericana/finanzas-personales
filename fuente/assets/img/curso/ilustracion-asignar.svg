    <rect x="512.0" y="60" width="31.5" height="52" rx="2"/>
    <rect x="548.5" y="60" width="31.5" height="52" rx="2"/>
    <rect x="600.0" y="60" width="31.8" height="52" rx="2"/>
    <rect x="636.8" y="60" width="31.8" height="52" rx="2"/>
    <rect x="673.7" y="60" width="31.8" height="52" rx="2"/>
    <rect x="710.5" y="60" width="31.8" height="52" rx="2"/>
    <rect x="747.3" y="60" width="31.8" height="52" rx="2"/>
    <rect x="784.2" y="60" width="31.8" height="52" rx="2"/>
    <rect x="836.0" y="60" width="32.2" height="52" rx="2"/>
    <rect x="873.2" y="60" width="32.2" height="52" rx="2"/>
    <rect x="910.5" y="60" width="32.2" height="52" rx="2"/>
    <rect x="947.8" y="60" width="32.2" height="52" rx="2"/>
  </g>

  <!-- Cada tramo baja a su propósito: trazo de 6 u. y punta de 28×24; la línea baja, la punta apunta hacia abajo y se detiene 22 u. antes del recipiente -->
  <g fill="#3F7D74">
    <rect x="397" y="122" width="6" height="46"/>
    <polygon points="386,166 414,166 400,190"/>
    <rect x="705" y="122" width="6" height="46"/>
    <polygon points="694,166 722,166 708,190"/>
    <rect x="905" y="122" width="6" height="46"/>
    <polygon points="894,166 922,166 908,190"/>
  </g>

  <!-- Los tres recipientes (los propósitos), del mismo ancho que su tramo -->
  <g filter="url(#ilu-asignar-sombra)">
    <rect x="220" y="212" width="360" height="160" rx="4" fill="#FFFFFF"/>
    <rect x="600" y="212" width="216" height="160" rx="4" fill="#FFFFFF"/>
    <rect x="836" y="212" width="144" height="160" rx="4" fill="#FFFFFF"/>
  </g>
