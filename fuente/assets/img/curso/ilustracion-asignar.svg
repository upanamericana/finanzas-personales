<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="Una franja dorada, el ingreso del mes, ya partida en piezas iguales y en tres tramos: uno de la mitad, otro de casi un tercio y otro de una quinta parte. De cada tramo baja una flecha a un recipiente blanco del mismo ancho, donde esas piezas quedan guardadas, todas con un lugar asignado y ninguna gastada todavía.">
  <!-- Ilustración de marca · Posgrados Panamericana · finanzas-personales · tema 2, apertura
       Concepto (DI, apertura del tema 2): «Un presupuesto es un plan que asigna cada peso de tu ingreso a un propósito
       antes de que lo gastes». Familia de UP (INSTITUCION.md §1.7), misma hoja que ilustracion-registrar.svg: fondo,
       esquinas de 4 px, sombra y ancho útil x 220–980. Los tramos siguen la proporción 50/30/20 de 2.1.
       Único dorado: el ingreso entero, en piezas separadas (cada peso). v2 (2026-11-17): piezas separadas y flechas más gruesas, por legibilidad a 390 px. Sin texto. Guion en insumos/ILUSTRACIONES.md. -->
  <defs>
    <linearGradient id="ilu-asignar-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E4EEEB"/>
      <stop offset="55%"  stop-color="#ECF1EF"/>
      <stop offset="100%" stop-color="#F6F8F7"/>
    </linearGradient>
    <filter id="ilu-asignar-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A4039" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="4" fill="url(#ilu-asignar-fondo)"/>

  <!-- ÚNICO DORADO: el ingreso del mes, en 20 piezas iguales y separadas (cada peso), en tres tramos 50/30/20.
       Hueco de 5 u. entre piezas (como las verdes de abajo) y de 20 u. entre tramos -->
  <g fill="#B9975B" filter="url(#ilu-asignar-sombra)">
    <rect x="220.0" y="60" width="31.5" height="52" rx="2"/>
    <rect x="256.5" y="60" width="31.5" height="52" rx="2"/>
